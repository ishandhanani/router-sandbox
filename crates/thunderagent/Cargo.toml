[package]
name = "thunderagent-dynamo-policy"
description = "ThunderAgent session-aware admission and routing policy for Dynamo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dynamo-kv-router = { git = "https://github.com/ai-dynamo/dynamo.git", branch = "idhanani/dyn-3231-session-aware-policy-crate", features = ["standalone-selection"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"
dynamo-kv-router = { git = "https://github.com/ai-dynamo/dynamo.git", branch = "idhanani/dyn-3231-session-aware-policy-crate", features = ["bench", "standalone-selection"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-util = "0.7"

[[bench]]
name = "admission_overhead"
harness = false
