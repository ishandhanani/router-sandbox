[package]
name = "thunderagent-dynamo-policy"
description = "ThunderAgent session-aware admission and routing policy for Dynamo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dynamo-kv-router = { git = "https://github.com/ai-dynamo/dynamo.git", branch = "idhanani/dyn-3231-live-progress", features = ["standalone-selection"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
