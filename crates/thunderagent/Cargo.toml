[package]
name = "thunderagent-dynamo-policy"
description = "ThunderAgent program-aware request classifier for Dynamo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
dynamo-kv-router = { git = "https://github.com/ai-dynamo/dynamo.git", rev = "9a4baf3b7bdb02c2e4e27e7029b3910f7bf3f29f", features = ["standalone-selection"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
