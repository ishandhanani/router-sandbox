[workspace]
members = [
    "crates/thunderagent",
    "crates/sticky-until-saturated",
    "crates/sglang-cache-aware",
    "crates/sgl-router-cache-aware",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ishandhanani/router-sandbox"

[workspace.dependencies]
dynamo-kv-router = { git = "https://github.com/ai-dynamo/dynamo.git", rev = "8878cc03cf88898b2afad0032bfbc67f5d1df9e7" }
